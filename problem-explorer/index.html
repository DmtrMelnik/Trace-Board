<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Trace Board</title>
  <link href='css/assembly.min.css' rel='stylesheet'>
  <link href='css/cera-fallback.css' rel='stylesheet'>
  <link href='css/polish.css' rel='stylesheet'>
  <link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'>
  <link rel='stylesheet' href='https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css'>
  <link rel='stylesheet' href='https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css'>
    <style>
    #map { height: 400px; border-radius: 12px; }
    .result-list { height: min(52vh, 560px); overflow: auto; }
    .detail-scroll { max-height: min(36vh, 380px); overflow: auto; }
    #detail-card { min-height: 280px; }
    .pin-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
    .row-num { width: 36px; flex: 0 0 auto; font-variant-numeric: tabular-nums; color: #757d82; }
    .result-row.is-active { outline: 2px solid #0f71fa; outline-offset: -2px; }
    .result-row.is-reviewed { opacity: 0.55; }
    .review-check { flex: 0 0 auto; display: flex; align-items: center; margin-right: 10px; }
    .review-check input { width: 16px; height: 16px; cursor: pointer; }
    .dd-link { flex: 0 0 auto; margin-left: 8px; text-decoration: none; white-space: nowrap; }
    .trace-block-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: #fff; border: 0; border-left: 3px solid #4264fb; padding: 8px 10px; margin: 10px 0 6px; border-radius: 0 8px 8px 0; box-shadow: 0 1px 0 rgba(14,16,18,.06); cursor: pointer; }
    .trace-block-head.is-active { background: #e7f0ff; box-shadow: inset 0 0 0 2px #0f71fa; }
    .trace-block-chevron { width: 14px; flex: 0 0 auto; color: #4264fb; }
    .tab-row { overflow-x: auto; }
    .q-chip { cursor: pointer; }
    .leaflet-popup-content { font-size: 13px; line-height: 1.4; margin: 10px 14px; }
    .legend-swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    #open-trace { white-space: nowrap; }
    .repeat-mark { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: #e7f0ff; color: #0f71fa; font-size: 11px; font-weight: 700; letter-spacing: 0; vertical-align: 1px; }
    .trace-filename { word-break: break-all; user-select: text; cursor: text; color: #0f71fa; }
    .trace-filename { word-break: break-all; }
    .trace-findings { max-height: min(56vh, 640px); overflow: auto; }
    .meta-json { white-space: pre-wrap; word-break: break-word; margin: 0; background: #f7f8f8; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body class='bg-gray-faint'>

  <header class='sticky top z2 bg-white' style='position:relative;box-shadow:0 1px 0 rgba(14,16,18,.06),0 2px 16px rgba(14,16,18,.04);'>
    <div class='wmax1200 mx-auto px24 flex flex--center-cross flex--space-between-main' style='height:64px;'>
      <div class='flex flex--center-cross'>
        <a href='https://www.mapbox.com/' class='flex flex--center-cross color-gray-dark' style='text-decoration:none;' aria-label='Mapbox home'>

        </a>
        <nav class='nav-links ml30' id='nav'>
          <span class='color-gray-dark px12 txt-ms txt-bold'>Trace Board</span>
          <a href='https://github.com/DmtrMelnik/Trace-Board' class='link color-gray-dark px12 txt-ms'>Registry repo</a>
          <a href='https://hey.mapbox.com/nav-native-viz/' class='link color-gray-dark px12 txt-ms'>nav-native-viz</a>
        </nav>
      </div>
      <button class='nav-toggle' aria-label='Menu' onclick="document.getElementById('nav').classList.toggle('is-open')">
        <svg class='icon' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><line x1='3' y1='6' x2='21' y2='6'/><line x1='3' y1='12' x2='21' y2='12'/><line x1='3' y1='18' x2='21' y2='18'/></svg>
      </button>
    </div>
    <input id='file-input' type='file' accept='.json,.geojson,.csv,.js' multiple style='display:none'>
  </header>

  <main>
    <section class='py30 bg-white' style='box-shadow:0 1px 0 rgba(14,16,18,.06);'>
      <div class='px24 flex flex--column flex--row-mm flex--center-cross-mm flex--space-between-main-mm'>
        <div>
          <h1 class='display-3 txt-bold color-gray-dark'>Trace Board</h1>
          <div class='txt-ms color-gray' id='data-status'>Loading snapshot…</div>
        </div>
        <div class='flex flex--center-cross mt12 mt0-mm'>
          <div class='txt-s color-gray mr18' id='overlay-status'></div>
          <button class='btn btn--stroke btn--s btn-pill px18 mr12' id='btn-load'>Load file</button>
          <button class='btn btn--s btn-pill px18' id='btn-export'>Export triage</button>
        </div>
      </div>
    </section>

    <section class='py24'>
      <div class='px24 grid grid--gut24' id='kpi-row'></div>
    </section>

    <section class='pb12'>
      <div class='px24'>
        <div class='txt-s txt-bold txt-uppercase color-gray txt-spacing1 mb12'>By Q-code</div>
        <div class='flex flex--wrap' id='q-chips'></div>
      </div>
    </section>

    <section class='pb18'>
      <div class='px24'>
        <div class='txt-s txt-bold txt-uppercase color-gray txt-spacing1 mb12'>Category</div>
        <div class='flex flex--wrap tab-row' id='category-tabs'></div>
      </div>
    </section>

    <section class='pb24'>
      <div class='px24'>
        <div class='card py24 px24'>
          <div class='grid grid--gut12'>
            <div class='col w-full mb12'>
              <label class='txt-s txt-bold mb6 block' for='trace-finder'>Trace finder</label>
              <div class='flex'>
                <input id='trace-finder' class='input flex-child-grow' type='search' placeholder='name ending in .pbf.gz' autocomplete='off'>
                <button type='button' class='btn btn--s btn-pill px18 ml6' id='trace-finder-go'>Find</button>
              </div>
              <div class='txt-xs color-gray mt6' id='trace-finder-status'></div>
            </div>
            <div class='col w-full w-1/3-ml mb12'>
              <label class='txt-s txt-bold mb6 block' for='search'>Search</label>
              <input id='search' class='input' type='search' placeholder='summary or problem_id'>
            </div>
            <div class='col w-1/2 w-1/6-ml mb12'>
              <label class='txt-s txt-bold mb6 block' for='filter-type'>problem_type</label>
              <div class='select-container'>
                <select id='filter-type' class='select'><option value=''>All types</option></select>
              </div>
            </div>
            <div class='col w-1/2 w-1/6-ml mb12'>
              <label class='txt-s txt-bold mb6 block' for='filter-severity'>Severity</label>
              <div class='select-container'>
                <select id='filter-severity' class='select'>
                  <option value=''>All</option>
                  <option value='high'>high</option>
                  <option value='medium'>medium</option>
                  <option value='low'>low</option>
                </select>
              </div>
            </div>
            <div class='col w-1/2 w-1/6-ml mb12'>
              <label class='txt-s txt-bold mb6 block' for='filter-sort'>Sort</label>
              <div class='select-container'>
                <select id='filter-sort' class='select'>
                  <option value='severity' selected>Severity</option>
                  <option value='time'>Time</option>
                  <option value='q'>Q-code</option>
                  <option value='div_desc'>Divergence + lasting (high→low)</option>
                  <option value='div_asc'>Divergence + lasting (low→high)</option>
                  <option value='poor_desc'>Driver stopped (high→low)</option>
                  <option value='poor_asc'>Driver stopped (low→high)</option>
                  <option value='eta_desc'>ETA impact (high→low)</option>
                  <option value='eta_asc'>ETA impact (low→high)</option>
                  <option value='soc_desc'>SOC prediction error (high→low)</option>
                  <option value='soc_asc'>SOC prediction error (low→high)</option>
                  <option value='incident_desc'>Incident length (high→low)</option>
                  <option value='incident_asc'>Incident length (low→high)</option>
                  <option value='overpred_desc'>Over-pred speed gap (high→low)</option>
                  <option value='overpred_asc'>Over-pred speed gap (low→high)</option>
                </select>
              </div>
            </div>
            <div class='col w-1/2 w-1/6-ml mb12'>
              <label class='txt-s txt-bold mb6 block' for='filter-label'>Triage label</label>
              <div class='select-container'>
                <select id='filter-label' class='select'>
                  <option value=''>All</option>
                  <option value='unlabeled'>Unlabeled</option>
                  <option value='true_map_issue'>true_map_issue</option>
                  <option value='nav_sdk'>nav_sdk</option>
                  <option value='driver_behavior'>driver_behavior</option>
                  <option value='noise'>noise</option>
                  <option value='expected_incident'>expected_incident</option>
                </select>
              </div>
            </div>
            <div class='col w-1/2 w-1/6-ml mb12'>
              <label class='txt-s txt-bold mb6 block' for='filter-viewed'>Viewed</label>
              <div class='select-container'>
                <select id='filter-viewed' class='select'>
                  <option value=''>All</option>
                  <option value='unseen'>Unseen</option>
                  <option value='viewed'>Viewed</option>
                </select>
              </div>
            </div>
            <div class='col w-1/2 w-1/6-ml mb12'>
              <label class='txt-s txt-bold mb6 block' for='filter-project'>Project</label>
              <div class='select-container'>
                <select id='filter-project' class='select'><option value=''>All</option></select>
              </div>
            </div>
            <div class='col w-1/2 w-1/6-ml mb12'>
              <label class='txt-s txt-bold mb6 block' for='filter-platform'>Platform</label>
              <div class='select-container'>
                <select id='filter-platform' class='select'><option value=''>All</option></select>
              </div>
            </div>
            <div class='col w-1/2 w-1/6-ml mb12'>
              <label class='txt-s txt-bold mb6 block' for='filter-vehicle'>VIN</label>
              <input id='filter-vehicle' class='input' type='search' placeholder='vehicle'>
            </div>
            <div class='col w-1/2 w-1/6-ml mb12'>
              <label class='txt-s txt-bold mb6 block' for='filter-user'>User ID</label>
              <input id='filter-user' class='input' type='search' placeholder='user_id'>
            </div>
            <div class='col w-1/2 w-1/6-ml mb12'>
              <label class='txt-s txt-bold mb6 block' for='filter-from'>From (UTC)</label>
              <input id='filter-from' class='input' type='date'>
            </div>
            <div class='col w-1/2 w-1/6-ml mb12'>
              <label class='txt-s txt-bold mb6 block' for='filter-to'>To (UTC)</label>
              <input id='filter-to' class='input' type='date'>
            </div>
            <div class='col w-full w-1/6-ml mb12 flex flex--center-cross'>
              <label class='checkbox-container txt-s'>
                <input id='filter-geo' type='checkbox'>
                <div class='checkbox mr6'></div>
                Coordinates only
              </label>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class='pb36'>
      <div class='px24 grid grid--gut24'>
        <div class='col w-full w-1/2-ml mb24'>
          <div class='card px18 py12 mb12' id='trace-name-bar' hidden></div>
          <div id='map' class='bg-white'></div>
          <div class='txt-s color-gray mt12 mb18' id='map-legend'></div>
          <div class='card px18 py18' id='detail-card'>
            <div class='txt-s color-gray'>Select a finding on the map or in the list.</div>
          </div>
        </div>
        <div class='col w-full w-1/2-ml mb24'>
          <div class='card px18 py18'>
            <div class='flex flex--space-between-main flex--center-cross mb12'>
              <div class='txt-s txt-bold txt-uppercase color-gray txt-spacing1'>Matching findings</div>
              <div class='flex flex--center-cross'>
                <label class='txt-s color-gray mr6' for='list-sort'>Sort</label>
                <div class='select-container mr12' style='min-width:240px'>
                  <select id='list-sort' class='select'>
                    <option value='severity'>Severity</option>
                    <option value='time'>Time</option>
                    <option value='q'>Q-code</option>
                    <option value='div_desc'>Divergence + lasting (high→low)</option>
                    <option value='div_asc'>Divergence + lasting (low→high)</option>
                    <option value='poor_desc'>Driver stopped (high→low)</option>
                    <option value='poor_asc'>Driver stopped (low→high)</option>
                    <option value='eta_desc'>ETA impact (high→low)</option>
                    <option value='eta_asc'>ETA impact (low→high)</option>
                    <option value='soc_desc'>SOC prediction error (high→low)</option>
                    <option value='soc_asc'>SOC prediction error (low→high)</option>
                    <option value='incident_desc'>Incident length (high→low)</option>
                    <option value='incident_asc'>Incident length (low→high)</option>
                    <option value='overpred_desc'>Over-pred speed gap (high→low)</option>
                    <option value='overpred_asc'>Over-pred speed gap (low→high)</option>
                  </select>
                </div>
                <div class='txt-s color-gray' id='list-count'></div>
              </div>
            </div>
            <div class='result-list' id='result-list'></div>
          </div>
        </div>
      </div>
      <div class='px24' id='trace-panel' hidden></div>
    </section>
  </main>

  <footer class='bg-gray-dark py24 prose--dark'>
    <div class='px24 flex flex--space-between-main flex--center-cross'>
      <a href='https://www.mapbox.com/' class='flex flex--center-cross color-white' style='text-decoration:none;' aria-label='Mapbox home'>
        <svg class='mb-logo' viewBox="0 0 126 28" role="img" aria-label="Mapbox" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
          <title>Mapbox</title>
